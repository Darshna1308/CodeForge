[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeforge-api"
version = "1.0.0"
description = "CodeForge HTTP API: auth, problems, submissions, SSE realtime gateway"
requires-python = ">=3.11"
dependencies = [
  "codeforge-core",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "email-validator>=2.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["codeforge_api*"]
