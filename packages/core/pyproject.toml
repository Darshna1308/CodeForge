[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeforge-core"
version = "1.0.0"
description = "Shared domain model, state machine, queue and event primitives for CodeForge"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["codeforge_core*"]
